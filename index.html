<!-- Popup -->
<div class="popup" id="newsletterPopup">
  <div class="popup-content">
    <h2>Join the list + get free weekly writing advice from Shirin!</h2>
    <form id="newsletterForm">
      <input type="email" name="email" placeholder="Enter your email" required>
      <br>
      <button type="submit">Subscribe</button>
    </form>
    <button class="close-btn" onclick="closePopup()">Close</button>
    <p style="font-size: 12px; color: #666; margin-top: 10px;">We respect your privacy.</p>
    <p id="thankYouMessage" style="display:none; color: green; margin-top: 15px;">Thank you!</p>
  </div>
</div>

<script>
  // Show popup after a short delay
  window.onload = function() {
    setTimeout(function() {
      document.getElementById("newsletterPopup").style.display = "flex";
    }, 2000); // popup appears after 2 seconds
  };

  function closePopup() {
    document.getElementById("newsletterPopup").style.display = "none";
  }

  // Handle form submission with JavaScript
  document.getElementById("newsletterForm").addEventListener("submit", function(e) {
    e.preventDefault(); // stop default redirect
    const form = e.target;

    fetch("https://formspree.io/f/xyzdayve", {
      method: "POST",
      body: new FormData(form),
      headers: { 'Accept': 'application/json' }
    })
    .then(response => {
      if (response.ok) {
        form.style.display = "none"; // hide form
        document.getElementById("thankYouMessage").style.display = "block"; // show thank you
      } else {
        alert("Oops! Something went wrong. Please try again.");
      }
    })
    .catch(error => {
      alert("Error: " + error);
    });
  });
</script>
