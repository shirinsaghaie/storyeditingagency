<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>STORY EDITING AGENCY</title>
  <style>
    body {
      background-color: white;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow-x: hidden;
    }
    .container {
      text-align: center;
    }
    h1 {
      font-size: 48px;
      color: black;
      margin: 0;
    }
    p {
      font-size: 24px;
      color: black;
    }

    /* Popup styles */
    #popup-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.4);
      display: none;
      z-index: 900;
    }
    #newsletter-popup {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: white;
      border: 1px solid #ccc;
      padding: 30px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      z-index: 1000;
      display: none;
      max-width: 90%;
      width: 400px;
    }
    #newsletter-popup h2 {
      margin-top: 0;
      font-size: 24px;
      color: black;
    }
    #newsletter-popup input[type="email"] {
      width: calc(100% - 24px);
      padding: 10px;
      margin: 12px 0;
      border: 1px solid #000;
      font-size: 16px;
    }
    #newsletter-popup button {
      padding: 10px 20px;
      background: black;
      color: white;
      border: none;
      cursor: pointer;
      font-size: 16px;
    }
    #newsletter-popup .close-btn {
      position: absolute;
      top: 8px;
      right: 12px;
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>STORY EDITING AGENCY</h1>
    <p>mail@storyeditingagency.com</p>
  </div>

  <div id="popup-overlay"></div>

  <div id="newsletter-popup">
    <button class="close-btn" onclick="closePopup()">×</button>
    <h2>SUBSCRIBE TO OUR NEWSLETTER</h2>
    <form action="https://formspree.io/f/xyzdayve" method="POST">
      <input type="email" name="email" placeholder="Your email address" required />
      <button type="submit">Subscribe</button>
    </form>
  </div>

  <script>
    // Show popup once per session
    window.addEventListener('load', function() {
      if (!sessionStorage.getItem('newsletterPopupShown')) {
        setTimeout(function() {
          document.getElementById('popup-overlay').style.display = 'block';
          document.getElementById('newsletter-popup').style.display = 'block';
        }, 2000); // show after 2 seconds
        sessionStorage.setItem('newsletterPopupShown', 'yes');
      }
    });

    function closePopup() {
      document.getElementById('newsletter-popup').style.display = 'none';
      document.getElementById('popup-overlay').style.display = 'none';
    }
  </script>
</body>
</html>
