<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>STORY EDITING AGENCY</title>
  <style>
    body {
      background-color: white;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      text-align: center;
    }
    h1 {
      font-size: 48px;
      color: black;
      margin: 0;
    }
    p {
      font-size: 24px;
      color: black;
    }

    /* Popup Styles */
    .popup {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }
    .popup-content {
      background: white;
      padding: 30px;
      border-radius: 10px;
      text-align: center;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 0 15px rgba(0,0,0,0.3);
    }
    .popup-content h2 {
      margin-top: 0;
      font-size: 24px;
      color: black;
    }
    .popup-content input[type="email"] {
      width: 80%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    .popup-content button {
      padding: 10px 20px;
      border: none;
      background: black;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }
    .close-btn {
      margin-top: 10px;
      background: #888;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>STORY EDITING AGENCY</h1>
    <p>mail@storyeditingagency.com</p>
  </div>

  <!-- Popup -->
  <div class="popup" id="newsletterPopup">
    <div class="popup-content">
      <h2>Join the list + get free weekly writing advice from Shirin!</h2>
      <form action="https://formspree.io/f/xyzdayve" method="POST">
        <input type="email" name="email" placeholder="Enter your email" required>
        <br>
        <button type="submit">Subscribe</button>
      </form>
      <button class="close-btn" onclick="closePopup()">Close</button>
    </div>
  </div>

  <script>
    // Show popup after a short delay
    window.onload = function() {
      setTimeout(function() {
        document.getElementById("newsletterPopup").style.display = "flex";
      }, 2000); // popup appears after 2 seconds
    };

    function closePopup() {
      document.getElementById("newsletterPopup").style.display = "none";
    }
  </script>
</body>
</html>
