<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STORY EDITING AGENCY</title>
  <style>
    body {
      background-color: white;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      text-align: center;
    }
    h1 {
      font-size: 48px;
      color: black;
      margin: 0;
    }
    p {
      font-size: 24px;
      color: black;
    }

    /* Popup styles */
    #newsletter-popup {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
    }
    .popup-content {
      background: white;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      max-width: 400px;
    }
    .close-btn {
      margin-top: 10px;
      cursor: pointer;
      color: red;
      font-size: 14px;
    }
    #thankyou-message {
      display: none;
      font-size: 20px;
      color: green;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>STORY EDITING AGENCY</h1>
    <p>mail@storyeditingagency.com</p>
  </div>

  <!-- Newsletter Popup -->
  <div id="newsletter-popup">
    <div class="popup-content">
      <h2>Join the list + get free weekly writing advice from Shirin!</h2>
      <form id="newsletter-form" action="https://formspree.io/f/xyzdayve" method="POST">
        <input type="email" name="email" placeholder="Your email" required>
        <button type="submit">Subscribe</button>
      </form>
      <div id="thankyou-message">Thank you!</div>
      <div class="close-btn" onclick="closePopup()">✖ Close</div>
      <p>We respect your privacy.</p>
    </div>
  </div>

  <script>
    // Show popup after delay
    window.onload = function() {
      setTimeout(function() {
        document.getElementById("newsletter-popup").style.display = "flex";
      }, 2000);
    };

    // Close popup
    function closePopup() {
      document.getElementById("newsletter-popup").style.display = "none";
    }

    // Handle Formspree submission with fetch
    document.getElementById("newsletter-form").addEventListener("submit", async function(e) {
      e.preventDefault();
      const form = e.target;
      const data = new FormData(form);
      const action = form.action;

      const response = await fetch(action, {
        method: "POST",
        body: data,
        headers: { 'Accept': 'application/json' }
      });

      if (response.ok) {
        form.style.display = "none";
        document.getElementById("thankyou-message").style.display = "block";
      } else {
        alert("Oops! Something went wrong. Please try again.");
      }
    });
  </script>
</body>
</html>
